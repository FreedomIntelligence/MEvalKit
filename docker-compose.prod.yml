version: '3.8'

services:
  mevalkit:
    build:
      context: .
      dockerfile: Dockerfile.prod
      cache_from:
        - mevalkit:prod
    image: mevalkit:prod
    container_name: mevalkit-prod
    ports:
      - "1984:1984"
    volumes:
      - mevalkit_data:/app/data
      - mevalkit_logs:/app/logs
      - mevalkit_results:/app/results
      - mevalkit_stress_test_results:/app/stress_test_results
      - mevalkit_custom_models:/app/custom_models
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1984"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mevalkit-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  nginx:
    image: nginx:alpine
    container_name: mevalkit-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - mevalkit
    restart: unless-stopped
    networks:
      - mevalkit-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  mevalkit-network:
    driver: bridge

volumes:
  mevalkit_data:
    driver: local
  mevalkit_logs:
    driver: local
  mevalkit_results:
    driver: local
  mevalkit_stress_test_results:
    driver: local
  mevalkit_custom_models:
    driver: local
  nginx_logs:
    driver: local 