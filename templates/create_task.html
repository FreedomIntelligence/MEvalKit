<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建评测任务 - LLM评测平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .form-card {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            background-color: #fff;
        }
        .form-title {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #dee2e6;
        }
        .form-section {
            margin-bottom: 2rem;
        }
        .form-select {
            font-size: 1rem;
            padding: 0.75rem;
        }
        .btn-primary {
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
        }
        .disabled-section {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container mt-4 mb-5">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">MEvalKit</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/">总榜</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/specific-leaderboard">分榜</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/create-task">创建任务</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <div class="form-card">
            <h1 class="form-title">创建评测任务</h1>
            
            <form action="/run-evaluation" method="post" id="evaluationForm">
                <div class="form-section">
                    <h4>选择评测数据集</h4>
                    <select class="form-select" id="dataset-select" name="dataset" required>
                        <option value="" disabled selected>请选择数据集</option>
                        <optgroup label="文本数据集">
                            {% for dataset in text_datasets %}
                            <option value="{{ dataset }}">{{ dataset }}</option>
                            {% endfor %}
                        </optgroup>
                        <optgroup label="多模态数据集">
                            {% for dataset in multimodal_datasets %}
                            <option value="{{ dataset }}">{{ dataset }}</option>
                            {% endfor %}
                        </optgroup>
                        <optgroup label="LLM判断数据集">
                            {% for dataset in llmjudge_datasets %}
                            <option value="{{ dataset }}">{{ dataset }}</option>
                            {% endfor %}
                        </optgroup>
                    </select>
                </div>
                
                <div class="form-section">
                    <h4>选择评测模式</h4>
                    <select class="form-select" id="eval-mode-select" name="eval_mode" required onchange="handleEvalModeChange()">
                        <option value="" disabled selected>请选择评测模式</option>
                        {% for mode in eval_modes %}
                        <option value="{{ mode }}">
                            {% if mode == "zero-shot" %}
                                零样本评估
                            {% elif mode == "few-shot" %}
                                少样本评估
                            {% else %}
                                {{ mode }}
                            {% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-section" id="model-selection-section">
                    <h4>选择评测模型</h4>
                    
                    <!-- 模型类型选择 -->
                    <div class="mb-3">
                        <label for="model-type-select" class="form-label">模型类型</label>
                        <select class="form-select" id="model-type-select" name="model_type">
                            <option value="default" selected>default</option>
                            <option value="vllm">vllm</option>
                            <option value="openai">openai</option>
                            <option value="anthropic">anthropic</option>
                            <option value="zhipu">zhipu</option>
                            <option value="doubao">doubao</option>
                        </select>
                        <div class="form-text">选择模型的类型，用于确定如何加载和调用模型</div>
                    </div>
                    
                    <!-- 模型名称选择 -->
                    <div class="mb-3">
                        <label for="model-select" class="form-label">模型名称</label>
                        <input type="text" class="form-control" id="model-select" name="model" 
                               placeholder="请输入模型名称，如 gpt-4、claude-3、qwen2.5-7b 等">
                        <div class="form-text">请输入要评测的模型名称</div>
                    </div>
                    
                    <!-- API接口路径输入 -->
                    <div class="mb-3">
                        <label for="api-base" class="form-label">API接口路径（可选）</label>
                        <input type="text" class="form-control" id="api-base" name="api_base" 
                               placeholder="API接口地址，如 http://localhost:8000/v1">
                        <div class="form-text">如果是自定义模型，请输入API接口地址</div>
                    </div>
                    
                    <!-- 模型密钥输入 -->
                    <div class="mb-3">
                        <label for="model-key" class="form-label">模型密钥（可选）</label>
                        <input type="password" class="form-control" id="model-key" name="model_key" 
                               placeholder="API密钥或访问令牌">
                        <div class="form-text">如果是API模型，请输入访问密钥</div>
                    </div>
                </div>
                
                <!-- 业务ID输入框 -->
                <div class="form-section">
                    <h4>业务ID</h4>
                    <input type="text" class="form-control" id="business-id" name="business_id" 
                           value="MMLUdoubao03" placeholder="请输入业务ID">
                    <div class="form-text">用于标识评测任务的业务ID，默认为 MMLUdoubao03</div>
                </div>
                
                <!-- 新增：评测数量输入框 -->
                <div class="form-section">
                    <h4>评测题目数量</h4>
                    <input type="number" class="form-control" id="question-limit" name="question_limit" 
                           placeholder="留空则评测全部题目">
                    <div id="question-limit-feedback" class="form-text">
                        请输入要评测的题目数量（正整数）。如果留空或输入无效值，将评测全部题目。
                    </div>
                </div>
                
                <!-- LLMJudge专用选项，默认隐藏 -->
                <div class="form-section" id="judge-model-section" style="display: none;">
                    <h4>选择判断模型</h4>
                    <input type="text" class="form-control" id="judgment-model-select" name="judgment_model" 
                           placeholder="请输入判断模型名称，如 gpt-4、claude-3 等">
                    <div class="form-text">用于评判模型回答质量的裁判模型</div>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">开始评测</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 处理评估模式变化
        function handleEvalModeChange() {
            const evalModeSelect = document.getElementById('eval-mode-select');
            const modelInput = document.getElementById('model-select');
            const modelSection = document.getElementById('model-selection-section');
            
            if (evalModeSelect.value === 'give_answers') {
                // 人工评估模式，隐藏模型选择部分
                modelSection.classList.add('disabled-section');
                modelInput.disabled = true;
            } else {
                // 其他模式，显示模型选择部分
                modelSection.classList.remove('disabled-section');
                modelInput.disabled = false;
            }
        }
        
        // 处理问题数量输入
        document.getElementById('question-limit').addEventListener('input', function() {
            const input = this.value.trim();
            const feedback = document.getElementById('question-limit-feedback');
            
            if (input === '') {
                feedback.textContent = '请输入要评测的题目数量（正整数）。如果留空或输入无效值，将评测全部题目。';
                feedback.classList.remove('text-danger');
                return;
            }
            
            const numValue = Number(input);
            if (isNaN(numValue) || !Number.isInteger(numValue) || numValue <= 0) {
                feedback.textContent = '输入无效！将评测全部题目。';
                feedback.classList.add('text-danger');
            } else {
                feedback.textContent = `将评测前 ${numValue} 个题目。`;
                feedback.classList.remove('text-danger');
            }
        });
        
        // 表单提交验证
        document.getElementById('evaluationForm').addEventListener('submit', function(event) {
            event.preventDefault(); // 阻止默认提交
            
            const evalMode = document.getElementById('eval-mode-select').value;
            const datasetSelect = document.getElementById('dataset-select');
            const modelInput = document.getElementById('model-select');
            
            // 检查是否选择了数据集
            if (!datasetSelect.value) {
                alert('请选择评测数据集');
                return;
            }
            
            // 如果不是人工评估，检查是否输入了模型名称
            if (evalMode !== 'give_answers' && !modelInput.value.trim()) {
                alert('请输入评测模型名称');
                return;
            }
            
            // 处理问题数量输入
            const questionLimit = document.getElementById('question-limit').value.trim();
            if (questionLimit !== '') {
                const numValue = Number(questionLimit);
                if (isNaN(numValue) || !Number.isInteger(numValue) || numValue <= 0) {
                    if (!confirm('您输入的题目数量无效，将评测全部题目。是否继续？')) {
                        return;
                    }
                }
            }
            
            // 显示加载状态
            const submitButton = document.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.textContent = '创建中...';
            submitButton.disabled = true;
            
            // 收集表单数据
            const formData = new FormData(this);
            
            // 发送请求
            fetch('/run-evaluation', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.result) {
                    // 创建成功，自动跳转到任务详情页面
                    window.location.href = data.data.redirect_url;
                } else {
                    // 创建失败，显示错误信息
                    alert('创建任务失败: ' + data.msg);
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            })
            .catch(error => {
                console.error('提交表单出错:', error);
                alert('提交表单时发生错误，请重试');
                submitButton.textContent = originalText;
                submitButton.disabled = false;
            });
        });
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            handleEvalModeChange();
        });
    </script>
</body>
</html>
