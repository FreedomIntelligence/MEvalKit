version: '3.8'

services:
  mevalkit:
    image: mevalkit:latest
    container_name: mevalkit
    ports:
      - "1984:1984"
    volumes:
      # 数据持久化
      - ./results:/app/results
      - ./logs:/app/logs
      - ./stress_test_results:/app/stress_test_results
      - ./data:/app/data
      - ./dataset_info:/app/dataset_info
      - ./custom_models:/app/custom_models
      - ./datasets_and_models:/app/datasets_and_models
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1984/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mevalkit-network

networks:
  mevalkit-network:
    driver: bridge 