MT-Bench:
  language: en

  max_score: 10

  background: null

  case: null

  image: null

  question:
    loading_way: json
    path:
      - data/mt-bench/question.jsonl
    key:
      - turns
    prompt_template: "Question: {question}"

  reference_answer:
    loading_way: json
    path:
      - data/mt-bench/question.jsonl
    key: 
      - reference
    prompt_template: "Reference Answer: {reference_answer}"

  judge_prompt:
    loading_way: txt
    path: data/mt-bench/scoring_criteria_without_reference.txt

  judge_prompt_with_reference:
    loading_way: txt
    path: data/mt-bench/scoring_criteria_with_reference.txt


MedEthicsMatrixCase:
  language: zh

  max_score: 5

  background: null

  image: null

  case:
    loading_way: csv
    path:
      - data/MedEthicsMatrixCase/MedEthicsMatrixCase.csv
    key: 
      - case
    prompt_template: "Case: {case}"

  question:
    loading_way: csv
    path:
      - data/MedEthicsMatrixCase/MedEthicsMatrixCase.csv
    key: 
      - questions
    prompt_template: "Question: {question}"

  reference_answer: null

  scoring_criteria: llmjudge

  judge_prompt:
    loading_way: txt
    path: data/MedEthicsMatrixCase/scoring_criteria.txt

  judge_prompt_with_reference: null






