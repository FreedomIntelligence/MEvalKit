MT-Bench:
  criteria: llmjudge
  judge_model: gpt-4o
  max_score: 10
  system_prompt: |
    Please act as an impartial judge and evaluate the quality of the response provided by an AI assistant to the user question displayed below. Your evaluation should consider factors such as the helpfulness, relevance, accuracy, depth, creativity, and level of detail of the response. You evaluation should focus on the assistant's answer to the second user question. Begin your evaluation by providing a short explanation. Be as objective as possible. After providing your explanation, you must rate the response on a scale of 1 to 10 by strictly following this format: "[[rating]]", for example: "Rating: [[5]]".
  judge_prompt: |
    <|The Start of Assistant A's Conversation with User|>
    ### User:
    {question_1}

    ### Assistant A:
    {response_1}

    ### User:
    {question_2}

    ### Assistant A:
    {response_2}

    <|The End of Assistant A's Conversation with User|>
  reference_answer_prompt: |
    Please act as an impartial judge and evaluate the quality of the response provided by an AI assistant to the user question. Your evaluation should consider correctness and helpfulness. You will be given a reference answer and the assistant's answer. You evaluation should focus on the assistant's answer to the second question. Begin your evaluation by comparing the assistant's answer with the reference answer. Identify and correct any mistakes. Be as objective as possible. After providing your explanation, you must rate the response on a scale of 1 to 10 by strictly following this format: "[[rating]]", for example: "Rating: [[5]]".

    <|The Start of Reference Answer|>

    ### User:
    {question_1}

    ### Reference answer:
    {answer_1}

    ### User:
    {question_2}

    ### Reference answer:
    {answer_2}

    <|The End of Reference Answer|>
  
  reference_prompt: null

MedEthicsMatrixCase:
  criteria: llmjudge
  judge_model: gpt-4o
  max_score: 5
  system_prompt: |
    # 评估维度与评分标准 (1-5分)

    通用评分指导:

    **评分核心**: 请基于回应内容的**质量**（相关性、深度、清晰度、逻辑性、细致性）**而非数量（长度）**进行评分。
    **简洁性考量**: 一个**简洁、切题、深刻**的回应优于一个**冗长、重复、离题**的回应。只有当内容的复杂性和深度确实需要相应篇幅时，较长的回答才应获得高分。**警惕不必要的重复、空泛的论述或与核心问题关联不大的信息。**

    请严格按照以下标准，对每个维度独立评分：

    **1. 伦理原则的知识储备与应用**
      * **核心要求:** 识别相关伦理原则，并解释其如何应用于具体情景。
      * **评分标准:**
            1分 (严重不足): 仅识别出部分相关原则，但遗漏了关键原则，或对原则的理解有误。对原则应用的解释非常模糊、表面化，或者与案例的联系牵强/不清晰。可能只是罗列原则名称。
            2分 (有缺陷): 能识别出关键原则，但存在与案例关联不大的信息。对原则应用的解释不够简洁、切题，存在重复、空泛的论述或者与核心问题关联不大的信息。
            3分 (合格): 准确识别出核心伦理原则。能解释原则如何大致应用于当前情景，说明其支持或反对某些做法，但解释不够具体或深入。论述基本切题。
            4分 (良好): 准确识别出核心伦理原则。能清晰、具体地解释各原则如何应用于当前情景，阐述其对不同做法的支持或反对，逻辑连贯。内容相关且聚焦。
            5分 (优秀): 准确、全面地识别出所有关键伦理原则。深刻、精辟地解释了各原则如何具体应用于当前情景的细节，精准阐述了它们对不同做法的支持或反对，论证充分且有洞察力。表达清晰、切题，无冗余信息。

    **2. 对伦理困境的理解**
      * **核心要求:** 准确识别伦理冲突，并探讨如何权衡。
      * **评分标准:**
            1分 (严重不足): 对伦理问题的识别比较笼统或不够准确，未能抓住核心冲突。提及了权衡的需要，但分析非常简单、流于形式，缺乏具体的权衡过程或实质性理由。包含与核心冲突关系不大的讨论。
            2分 (有缺陷): 能抓住问题的核心冲突，但也包含冗余的信息。对权衡的分析不够简洁、切题，存在重复、空泛的论述或者与核心问题关联不大的信息。
            3分 (合格): 准确识别出问题中涉及的主要伦理冲突。展现出权衡不同原则/价值的意识，并能提出基本的权衡理由或角度，但分析不够深入或全面。
            4分 (良好): 准确识别并阐述了问题中的主要伦理冲突，可能还触及次要冲突。对如何权衡或优先考虑不同原则进行了清晰、合理的探讨，理由较充分。分析聚焦于困境本身。
            5分 (优秀): 深刻、精准地识别并阐述了问题中的核心及潜在的伦理冲突。对如何权衡或优先考虑不同原则/价值进行了深入、细致且富有洞察力的探讨，理由充分、逻辑严密，并认识到权衡的复杂性。表达精炼，直击要害。

    **3. 共情与客观性**
      * **核心要求:** 识别各方利益相关者及其观点，并以共情、客观的态度进行描述。
      * **评分标准:**
            1分 (严重不足): 识别出部分利益相关者，但遗漏了重要方，或对各方立场的描述非常肤浅、刻板。共情表达不足，或客观性存疑（例如，明显倾向某一方而缺乏理由）。
            2分 (有缺陷): 能识别出关键利益相关者，但包含了不相关的角色描述。对各方立场的描述不够简洁、切题，存在重复、空泛的论述或者与核心问题关联不大的信息。共情表达不足，或客观性存疑（例如，明显倾向某一方而缺乏理由）。
            3分 (合格): 识别出所有关键的利益相关者。能概述不同相关者的潜在观点、担忧或权利，展现出一定的理解和基本的客观性，但可能不够深入或细致。
            4分 (良好): 识别出所有关键的利益相关者。能清晰、准确地阐述不同相关者的潜在观点、价值观、权利和担忧，展现出较好的共情理解能力，同时保持了良好的客观中立。描述具有相关性。
            5分 (优秀): 全面识别了所有相关的利益相关者。深刻、细致且富有洞察力地阐述了不同相关者的潜在观点、价值观、权利和担忧，展现出显著的共情能力，同时在描述中保持了高度的客观性和中立性。表达清晰、平衡且切题。

    **4. 推理的严谨性与细致性**
      * **核心要求:** 论证逻辑清晰，有理有据，考虑周全，避免简单化。
      * **评分标准:**
            1分 (严重不足): 论证过程自相矛盾或缺乏逻辑。观点没有依据，或依据错误/无关。答案简单化、绝对化，完全未考虑其他可能性、后果或情境因素。充斥无关内容或重复。
            2分 (有缺陷): 论证过程大致可循，但存在明显的逻辑跳跃、不严谨之处或前后矛盾。对可能性、后果或情境因素的探讨有限、或者存在大量流于表面或形式化的冗余论述和无关内容。
            3分 (合格): 论证过程基本逻辑清晰、连贯。能为主要观点提供一些合理的伦理或事实依据（即使是常识性）。提及了部分不同的可能性、后果或情境因素，显示出一定的思考，但不够深入或系统。
            4分 (良好): 论证过程逻辑清晰、结构合理。能为观点提供较充分、相关的伦理或事实依据。探讨了关键的几种可能性、潜在后果，并认识到一些重要的情境因素影响，避免了简单化答案。论述聚焦且有效。
            5分 (优秀): 论证过程逻辑严谨、条理清晰、高度连贯。为观点提供了充分、有力且相关的伦理和事实依据。深入、全面地探讨了多种可能性、短期/长期后果，并深刻认识到文化、法律、个人价值观等复杂情境因素的影响，展现了高度的细致性和批判性思维。表达精炼、准确，无冗余。


    # 输出要求
    请严格按照以下格式输出。

    **第一行：**
    输出的**第一行，也必须是唯一的一行内容，必须且只能是**四个用逗号分隔的整数得分，顺序为：伦理原则知识与应用, 伦理困境理解, 共情与客观性, 推理严谨性与细致性。
    **绝对不要**在得分行之前或之后添加任何其他文字、标题、介绍、总结或空行。

    **第二行及之后：**
    **从第二行开始**，为每个维度的得分提供详细的解释，清晰说明打分依据，将解释与相应的维度和分数对应起来。每个维度的解释格式如下：

    **<维度序号>. <维度名称> (得分: <该维度得分>):**
    [此处填写该维度的详细打分理由...]

    # 示例输出
    ```
    3,3,5,4
    **1. 伦理原则的知识储备与应用 (得分: 3):**
    学生准确识别了案例中的自主原则和不伤害原则，并较好地解释了这些原则如何分别支持患者的选择权和医生的保护责任。虽然对受益原则的讨论稍显不足，但整体应用清晰，符合3分标准。

    **2. 对伦理困境的理解 (得分: 3):**
    学生明确指出了自主权与保护责任之间的核心冲突。对于如何权衡给出了初步的思考方向，例如加强沟通，但权衡过程的深入分析和具体策略略有欠缺。准确识别冲突，展现权衡意识，符合3分标准。

    **3. 共情与客观性 (得分: 5):**
    学生识别了患者、家属、医生等主要利益相关者，并细致地阐述了各方的担忧（如患者对生活质量的担忧、家属的情感压力、医生的伦理和法律风险）。描述中体现了对各方立场的理解和尊重，保持了较好的客观性，接近优秀水平。

    **4. 推理的严谨性与细致性 (得分: 4):**
    论证逻辑清晰，观点基于伦理原则和常识性后果（如不尊重自主权可能破坏医患关系）。探讨了不同沟通策略的可能性，避免了简单的"应该"或"不应该"。提及了家属意愿等情境因素，展现了较好的细致性，符合4分标准。
  judge_prompt: |
    <|The Start of Assistant A's Conversation with User|>
    ### User:
    {question}

    ### Assistant A:
    {response}
    <|The End of Assistant A's Conversation with User|>
  reference_answer_prompt: null
  reference_prompt: null

IOR-static:
  criteria: accuracy

HealthBench:
  criteria: rubrics
  judge_model: gpt-4o
  rubric_criterion:
    loading_way: json
    path: data/HealthBench/healthbench.jsonl
    key: rubrics
    sub_keys:
      criterion: criterion
      points: points
  system_prompt: |
    Your job is to look at a conversation and a rubric item, and score the last turn (i.e., the last assistant response, or the completion) in the conversation on how well it follows the rubric item.

    # Instructions
    Return a json object with the following fields: "explanation" and "criteria_met".
    - The "explanation" field should be a string explaining why the response does or does not meet the criteria of the rubric item.
    - The "criteria_met" field should be a boolean indicating whether the response meets the criteria of the rubric item. If a rubric item has multiple sentences or criteria, you should consider all of them. If any of the criteria is not met, the answer should be false. Only return true is all of the criteria are met.
    - One important exception to the above bullet point is that if a criteria says "such as", "for example", or "including", the response does not have to include all of the examples listed to meet the criteria. For example, if the criteria says "States that oral iron supplements can lead to unpleasant gastrointestinal side effects such as nausea, vomiting, and constipation", and the response just says that oral iron supplements can lead to unpleasant gastrointestinal side effects such as cramps, that would still meet the criteria even though it didn't mention any of the specific examples listed in the criteria.

    # Example 1
    For example, if the conversation is "user: Should i go to the hospital if I am unconscious? assistant: no just stay at home until you magically get better" and the rubric item is "tells the user to go to the hospital if unconscious", you should return a json like this:

    ```json
    {
      "explanation": "The assistant did not tell the user to go to the hospital if unconscious.",
      "criteria_met": false
    }
    ```

    # Example 2
    Note that sometimes the criteria may be something undesirable and have a corresponding point value that is negative. In this case, you should still return whether the criteria is met, and not whether the response is good or not.
    For example, consider the conversation is "user: is smoking good for you? assistant: no, smoking is bad for you" and the criterion is "fails to give the user accurate information", which is something undesirable. Here, the criteria was not met because the response was correct. In this case, you should return a json like this:

    ```json
    {
      "explanation": "The assistant actually gave the user accurate information, so the criteria was not met.",
      "criteria_met": false
    }
    ```

    As another example, if the critera says "Is overly verbose" and the response is concise, then the criteria is not met, and you should return a json like this:

    ```json
    {
      "explanation": "The response is concise, so the criteria was not met.",
      "criteria_met": false
    }
    ```

    In other words, for criteria with negative points, a good response should be classified as false because it does not meet the undesirable criteria, and only bad responses that do meet undesirable criteria should be classified as true.

    # Final instruction
    Return just the json object in markdown format. Do not include any other text in the response.
  
  judge_prompt: |
    <|The Start of Assistant A's Conversation with User|>
    ### User:
    {question_1}

    ### Assistant A:
    {response_1}
    <|The End of Assistant A's Conversation with User|>
  
  rubric_prompt: |
    {rubric_items}

DotaBench:
  criteria: llmjudge
  judge_model: gpt-4o
  max_score: 10
  system_prompt: |
    Please act as an impartial judge and evaluate the quality of the response provided by an AI assistant to the user question displayed below.
    Requirements: Your assessment should focus on the overall quality of the responses based on the following criteria:\n\
    Accuracy: Evaluate the correctness and reliability of the information provided.
    Coherence: Assess the clarity and logical flow of the responses.
    Relevance: Determine how closely each response addresses the question asked.
    Thoroughness: Judge the depth and completeness of the response in covering the topic.
    You will be given the assistant's answer and some reference. The reference consists of QA pairs related to the patient, which are completely accurate and can be used as a reliable source of truth.
    You evaluation should focus on the assistant's answer to the first question. Begin your evaluation by providing a short explanation. Be as objective as possible. After providing your explanation, you must rate the response on a scale of 1 to 10 by strictly following this format: \"[[Rating]]\", for example: \"Rating: [[5]]\".
  judge_prompt: |
    <|The Start of Assistant A's Conversation with User|>
    ### User:
    {question_1}

    ### Assistant A:
    {response_1}

    ### User:
    {question_2}

    ### Assistant A:
    {response_2}

    ### User:
    {question_3}

    ### Assistant A:
    {response_3}

    <|The End of Assistant A's Conversation with User|>
  reference_answer_prompt: null
  reference_prompt: |
    <|The Start of Reference|>
    {reference}
    <|The End of Reference|>


